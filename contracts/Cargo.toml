[package]
name = "micro_roulette"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "MicroRoulette - Provably Fair On-Chain Roulette on Linera"

[lib]
name = "micro_roulette"
path = "src/lib.rs"

[[bin]]
name = "micro_roulette_contract"
path = "src/contract.rs"

[[bin]]
name = "micro_roulette_service"
path = "src/service.rs"

[features]
default = []
test = ["linera-sdk/test"]

[dependencies]
linera-sdk = "0.15.8"
linera-views = "0.15.8"
async-graphql = { version = "=7.0.17", default-features = false }
async-graphql-value = "=7.0.17"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"
sha2 = "0.10"
hex = "0.4"
log = "0.4"

[dev-dependencies]
linera-sdk = { version = "0.15.8", features = ["test"] }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
