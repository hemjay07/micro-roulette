version: '3.8'

services:
  roulette:
    build: .
    ports:
      - "8080:8080"
      - "8081:8081"
    environment:
      - LINERA_FAUCET_URL=https://faucet.testnet-conway.linera.net
      - RUST_LOG=info
    volumes:
      - linera-data:/root/.config/linera
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  linera-data:
