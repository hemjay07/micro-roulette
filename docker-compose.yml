version: '3.8'

services:
  roulette:
    build:
      context: .
      args:
        - VITE_APP_ID=9b16ccbe34c686f959ad6d3ebe9dde35a1ab7cf73a99a470feae0b082be59059
        - VITE_CHAIN_ID=781078b5a05e20fb1cd13c06622ccc91f813d112f020816e799a9ec1ba4298dc
        - VITE_LINERA_FAUCET_URL=https://faucet.testnet-conway.linera.net
    ports:
      - "8080:8080"
      - "8082:8082"
    environment:
      - LINERA_FAUCET_URL=https://faucet.testnet-conway.linera.net
      - APP_ID=9b16ccbe34c686f959ad6d3ebe9dde35a1ab7cf73a99a470feae0b082be59059
      - CHAIN_ID=781078b5a05e20fb1cd13c06622ccc91f813d112f020816e799a9ec1ba4298dc
      - LINERA_SERVICE_PORT=8082
      - RUST_LOG=info
    volumes:
      - linera-data:/root/.config/linera
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  linera-data:
